description: AcmeBot baseline red team
targets:
  - id: http
    label: acmebot
    config:
      url: http://localhost:8000/chat
      method: POST
      headers:
        Content-Type: application/json
      body:
        message: '{{prompt}}'
      transformResponse: json.reply
redteam:
