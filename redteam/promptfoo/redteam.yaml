    - id: hijacking
      numTests: 5
    - id: pii:direct
      numTests: 5
    - id: prompt-extraction
      numTests: 5
  strategies:
    - id: basic
    - id: jailbreak
    - id: prompt-injection
  entities: &ref_0 []
